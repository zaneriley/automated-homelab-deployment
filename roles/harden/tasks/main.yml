---
# roles/harden/tasks/main.yml
# Three-layer de-Apple work (ADR-0003). Each layer is gated by a variable
# from defaults/main.yml. Layers 2 and 3 default OFF.

# ---------- Layer 1: Disable ----------

- name: "Harden/L1 — empty Dock persistent-apps + persistent-others"
  community.general.osx_defaults:
    domain: com.apple.dock
    key: "{{ item }}"
    type: array
    value: []
    state: present
  loop:
    - persistent-apps
    - persistent-others
  when: harden_apple_cruft_disable | bool
  notify: Restart Dock
  tags: [harden, apple_cruft, harden_apple_cruft_disable]

# Siri and Apple Intelligence launch-agent disables (user scope).
# Pattern: read current disabled-list, then conditionally disable each
# label that isn't already on the list. This gives honest idempotency —
# the disable command only runs when there's actual state to change.

- name: "Harden/L1 — read current launchctl disabled-services (user scope)"
  ansible.builtin.command:
    cmd: "launchctl print-disabled gui/{{ ansible_user_uid }}"
  register: harden_launchctl_disabled
  changed_when: false
  check_mode: false
  when: harden_apple_cruft_disable | bool
  tags: [harden, apple_cruft, harden_apple_cruft_disable, launchctl]

# Parse the print-disabled output once into a list of already-disabled
# labels via regex_findall. Pre-fix this was a substring search of the
# raw multi-line stdout (`'"X" => disabled' not in stdout`); a single
# whitespace change in Apple's output format would silently break the
# match, causing the disable command to re-run for every label and
# falsifying the ADR-0009 second-`make check`-zero witness.
- name: "Harden/L1 — extract already-disabled labels"
  ansible.builtin.set_fact:
    harden_launchctl_already_disabled: >-
      {{ harden_launchctl_disabled.stdout
         | default('')
         | regex_findall('"([^"]+)"\s*=>\s*disabled') }}
  when: harden_apple_cruft_disable | bool
  tags: [harden, apple_cruft, harden_apple_cruft_disable, launchctl]

- name: "Harden/L1 — disable Siri + Apple Intelligence user launch agents"
  ansible.builtin.command:
    cmd: "launchctl disable gui/{{ ansible_user_uid }}/{{ item }}"
  loop: "{{ harden_launchctl_disable_labels }}"
  when:
    - harden_apple_cruft_disable | bool
    - item not in harden_launchctl_already_disabled
  changed_when: true
  tags: [harden, apple_cruft, harden_apple_cruft_disable, launchctl]

# ---------- Layer 2: Delete bundles ----------
# Default OFF. Rehearse in Tart VM before flipping (ADR-0003).
# Targets are user-removable consumer apps that Apple ships under
# /Applications/ — never /System/Applications/ (ADR-0005).
# state=absent is honestly idempotent: removes the bundle if present,
# reports unchanged if already gone. No `command: rm -rf` (ADR-0004
# spirit — prefer the native module).

- name: "Harden/L2 — delete user-removable consumer Apple app bundles"
  ansible.builtin.file:
    path: "/Applications/{{ item }}"
    state: absent
  loop: "{{ harden_apple_cruft_bundles }}"
  when: harden_apple_cruft_delete_bundles | bool
  become: true
  tags: [harden, apple_cruft, harden_apple_cruft_delete_bundles]

# ---------- Layer 3: Block telemetry ----------
# Default OFF. Can break softwareupdate. Adds land in follow-up commits
# and are gated by harden_apple_cruft_block_telemetry.

# ---------- Network exposure ----------
# Not a de-Apple layer — see the "Network exposure" header in
# defaults/main.yml for toggles, blast radius, and undo.

# Sharing services: read every listening TCP socket once, then assert
# each port's state. netstat sees launchd-owned sockets without root.
# Loopback-only listeners are ignored — they are not reachable from
# the network.
- name: "Harden/Exposure — read listening TCP sockets"
  ansible.builtin.command:
    argv: [/usr/sbin/netstat, -an, -p, tcp]
  register: harden_netstat
  changed_when: false
  check_mode: false
  when: harden_sharing_services_assert | bool
  tags: [harden, network_exposure, sharing_services]

- name: "Harden/Exposure — extract non-loopback listening ports"
  ansible.builtin.set_fact:
    harden_listening_ports: >-
      {{ harden_netstat.stdout
         | regex_findall('^tcp(?:4|6|46)\s+\d+\s+\d+\s+(\S+)\.(\d+)\s+\S+\s+LISTEN', multiline=True)
         | rejectattr('0', 'match', '^(127\.|::1$)')
         | map(attribute='1') | map('int') | unique | list }}
  when: harden_sharing_services_assert | bool
  tags: [harden, network_exposure, sharing_services]

- name: "Harden/Exposure — assert sharing services that must be off"
  ansible.builtin.assert:
    that: item.port not in harden_listening_ports
    fail_msg: >-
      {{ item.service }} is listening on TCP {{ item.port }}. Turn it off in
      System Settings → General → Sharing, or allow it deliberately by
      overriding harden_sharing_ports_closed for this host.
    quiet: true
  loop: "{{ harden_sharing_ports_closed }}"
  loop_control:
    label: "{{ item.service }} (TCP {{ item.port }})"
  when: harden_sharing_services_assert | bool
  tags: [harden, network_exposure, sharing_services]

- name: "Harden/Exposure — assert sharing services that must be on"
  ansible.builtin.assert:
    that: item.port in harden_listening_ports
    fail_msg: >-
      {{ item.service }} is not listening on TCP {{ item.port }}. Turn it on in
      System Settings → General → Sharing.
    quiet: true
  loop: "{{ harden_sharing_ports_open }}"
  loop_control:
    label: "{{ item.service }} (TCP {{ item.port }})"
  when: harden_sharing_services_assert | bool
  tags: [harden, network_exposure, sharing_services]

# Application Firewall. socketfilterfw has no "would change" mode, so
# read the state first and only run the set command when it is off —
# the same read-then-act pattern as the launchctl disables above.
# State values: 0 = off, 1 = on, 2 = on and blocking all incoming
# (stricter; left alone). An unparseable read fails the run loudly.
- name: "Harden/Exposure — read Application Firewall state"
  ansible.builtin.command:
    argv: [/usr/libexec/ApplicationFirewall/socketfilterfw, --getglobalstate]
  register: harden_firewall_read
  changed_when: false
  check_mode: false
  when: harden_application_firewall | bool
  tags: [harden, network_exposure, firewall]

- name: "Harden/Exposure — turn on Application Firewall"
  ansible.builtin.command:
    argv: [/usr/libexec/ApplicationFirewall/socketfilterfw, --setglobalstate, "on"]
  become: true
  when:
    - harden_application_firewall | bool
    - (harden_firewall_read.stdout | regex_search('State = (\d)', '\\1') | first) == '0'
  changed_when: true
  tags: [harden, network_exposure, firewall]
