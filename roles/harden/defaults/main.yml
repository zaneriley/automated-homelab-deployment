---
# Harden role defaults (ADR-0003 — three layers, blast radius increases with layer).
# Override via group_vars/workstations.yml or host_vars/<host>.yml.
#
# These live in `defaults/` (not `vars/`) deliberately. Ansible variable
# precedence puts role `vars/` *above* inventory `group_vars/` — putting
# overridable data in `vars/` makes the documented override path silently
# fail. `defaults/` (precedence 1) sits below group/host vars, so overrides
# work as expected.

# ---------- Layer toggles ----------

# Layer 1 — disable: launch agents, Dock cleanup, iCloud sync toggles where scriptable.
harden_apple_cruft_disable: true

# Layer 2 — delete consumer /Applications/*.app bundles (iWork, GarageBand, iMovie).
# Default OFF. Rehearse in a Tart VM before flipping.
harden_apple_cruft_delete_bundles: false

# Layer 3 — /etc/hosts null-route Apple analytics domains.
# Default OFF. Can break softwareupdate.
harden_apple_cruft_block_telemetry: false

# ---------- Layer 1 data — launchctl labels to disable ----------
# User-scope (gui/<uid>) launch agents to disable when
# `harden_apple_cruft_disable: true`. Siri / Apple Intelligence daemons
# plus the supporting daemons for Apple's bundled consumer apps that
# Z does not use (Calendar, Photos, Maps, News, Mail, Contacts, Books,
# FaceTime, Find My, Game Center, Home, Notes, Podcasts, Voice, Weather,
# Stickers, Safari sync).
#
# Disabling via `launchctl disable` is persistent — the daemon won't
# launch on next login. We deliberately do NOT `launchctl bootout` the
# currently-running instances; a logout/login cycle handles that
# cleanly without the bootout idempotency dance.
#
# Side effects (worth knowing before flipping `harden_apple_cruft_disable`):
#   - Mail/Contacts daemons disabled → if you re-enable Apple Mail.app
#     later, calendar invites preview, contact autocomplete, and iCloud
#     mail sync will all be broken until you remove this list.
#   - Find My daemons disabled → "Find My Mac" stops working (no remote
#     locate / lock / wipe).
#   - Photos daemons disabled → Photo Booth and Continuity Camera lose
#     auto-import; iMessage's photo picker still works but slower.
#   - Maps daemons disabled → Maps.app launches but background traffic
#     and pinned-place sync stop.
#   - Home daemons disabled → HomeKit-via-Apple-Home is dead; HomeKit
#     bridges via Home Assistant / mqtt / etc. are unaffected.
#   - Game Center disabled → no leaderboards, no Game Center sign-in.
#     Standalone single-player apps work fine.
#
# To carve out an exception on a specific host: override
# `harden_launchctl_disable_labels` in `group_vars/workstations.yml`
# (your gitignored override) or `host_vars/<host>.yml` with a tweaked list.

harden_launchctl_disable_labels:
  # Siri (com.apple.Siri.agent is already disabled on fresh macOS Tahoe;
  # this list is OS-version-independent — the additional Siri agents
  # below are stable across Big Sur → Tahoe).
  - com.apple.assistantd
  - com.apple.siriactionsd
  - com.apple.siri.context.service

  # Apple Intelligence stack
  - com.apple.generativeexperiencesd
  - com.apple.intelligenceplatformd
  - com.apple.intelligenceflowd
  - com.apple.intelligencetasksd
  - com.apple.intelligencecontextd
  - com.apple.callintelligenced

  # Calendar
  - com.apple.calendar.CalendarAgentBookmarkMigrationService

  # Photos
  - com.apple.cloudphotod
  - com.apple.photoanalysisd
  - com.apple.photolibraryd
  - com.apple.CloudPhotosConfiguration

  # Maps
  - com.apple.Maps.mapspushd
  - com.apple.Maps.mapssyncd
  - com.apple.maps.destinationd

  # News
  - com.apple.newsd

  # Mail (kept disabled because Z uses third-party clients)
  - com.apple.email.maild
  - com.apple.icloudmailagent
  - com.apple.MailServiceAgent
  - com.apple.mdworker.mail

  # Contacts (Apple's Contacts.app + iCloud sync; third-party tools
  # can still talk to ~/Library/Application Support/AddressBook/ if
  # we ever revisit, but the background syncing daemons stay off)
  - com.apple.AddressBook.AssistantService
  - com.apple.AddressBook.SourceSync
  - com.apple.AddressBook.abd
  - com.apple.contacts.donation-agent
  - com.apple.contacts.postersyncd
  - com.apple.contactsd

  # Books
  - com.apple.bookassetd
  - com.apple.bookdatastored

  # FaceTime (Messages.app stays — separate from FaceTime daemons)
  - com.apple.facetimemessagestored

  # Find My — note the lost-laptop trade-off in the header comment
  - com.apple.findmy.findmylocateagent
  - com.apple.findmymacmessenger
  - com.apple.icloud.findmydeviced.findmydevice-user-agent

  # Game Center
  - com.apple.gamed
  - com.apple.gamesaved
  - com.apple.GameController.gamecontrolleragentd
  - com.apple.GameOverlayUI
  - com.apple.GamePolicyAgent
  - com.apple.gamecontroller.ConfigService

  # Apple Home (HomeKit-via-Apple). HomeKit through Home Assistant is
  # a separate stack and is unaffected.
  - com.apple.homed
  - com.apple.homeenergyd
  - com.apple.homeeventsd

  # Notes (Apple Notes.app — Z uses Obsidian)
  - com.apple.LinkedNotesUIService
  - com.apple.Notes.datastore
  - com.apple.notes.exchangenotesd

  # Podcasts
  - com.apple.podcasts.PodcastContentService

  # Voice (memos + voice banking accessibility data collection — keep
  # the macOS-wide accessibility VoiceOver service running)
  - com.apple.voicebankingd
  - com.apple.voicememod

  # Weather widget / app
  - com.apple.weatherd

  # Stickers (iMessage stickers UI)
  - com.apple.stickersd

  # Safari bookmarks sync (Z uses Zen — Safari is the system fallback,
  # not the daily driver, so the iCloud bookmark sync is dead weight)
  - com.apple.SafariBookmarksSyncAgent

# ---------- Layer 2 data — consumer .app bundles to delete ----------
# User-removable consumer Apple app bundles in /Applications/ (NOT
# /System/Applications/, which is SIP-protected and out of scope per
# ADR-0005). Apple ID + Mac App Store will offer reinstalls — this
# role is the steady-state authority, not a one-shot. Default OFF;
# rehearse in Tart before flipping (ADR-0003).

harden_apple_cruft_bundles:
  - GarageBand.app
  - iMovie.app
  - Keynote.app
  - Numbers.app
  - Pages.app

# ---------- Network exposure (not a de-Apple layer) ----------
# What other machines on the network can reach on this host. Separate
# from the ADR-0003 layers: those remove Apple features, this block
# limits who can connect in.

# Assert that macOS sharing services are in the expected state. Read-only:
# a mismatch FAILS the run (any_errors_fatal) instead of being fixed,
# because each service is a deliberate on/off choice made in
# System Settings → General → Sharing. Blast radius: none (reads only).
# Undo: set false, or edit the port lists below.
#
# Why this matters: CVE-2026-65400 (fixed in macOS 26.6.1) let anyone who
# could reach Screen Sharing log in without credentials, and it was used
# to install cryptominers on Macs with TCP 5900 reachable. Rotating the
# password did not help; only patching or turning the service off did.
harden_sharing_services_assert: true

# Each service owns its well-known TCP port only while it is switched on
# (launchd holds the listening socket for on-demand services), so a
# non-loopback listener on the port is the honest "is it on" signal.
# Override in host_vars to allow one deliberately.
harden_sharing_ports_closed:
  - { service: "Screen Sharing", port: 5900 }
  - { service: "Remote Management (Apple Remote Desktop)", port: 3283 }
  - { service: "File Sharing (SMB)", port: 445 }
  - { service: "Remote Apple Events", port: 3031 }

# Remote Login stays on: the master node is headless-capable and is
# reached over SSH (Tailscale, phone-to-Codex). Narrowing sshd itself
# (keys only, interface binding) is a separate change.
harden_sharing_ports_open:
  - { service: "Remote Login (SSH)", port: 22 }

# Turn on the built-in Application Firewall (inbound, per-application).
# Blast radius: an app that is neither Apple-signed nor a validly signed
# download gets its incoming connections blocked until allowed in
# System Settings → Network → Firewall → Options. Apple's own sharing
# services (sshd included) are not filtered by it. It has no port or
# interface rules, so it is not the network boundary — LuLu covers
# outbound, and Tailscale/pf are the place for per-interface rules.
# Undo: set false, then
#   sudo /usr/libexec/ApplicationFirewall/socketfilterfw --setglobalstate off
# (false only stops this role from turning it on; it never turns it off).
harden_application_firewall: true
